[package]
name = "graphics-ui-renderer"
description = "Draws a finished UI scene with WebGPU, natively and in the browser"
version = "0.1.0"
silk-version = "0.1.0-dev.61+91f335268900"
kind = "library"
exports = ["text", "atlas_textures", "instances", "renderer", "generated_shaders", "readback", "compare"]

[dependencies]
vector = { path = "../vector", package = "graphics-vector" }
atlas = { path = "../atlas", package = "graphics-atlas" }
ui_scene = { path = "../ui_scene", package = "graphics-ui-scene" }
gpu_scene = { path = "../gpu_scene", package = "graphics-gpu-scene" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "bb39218c2174e12ae276cf0b1863ac2c6d84bd95", path = "native/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "bb39218c2174e12ae276cf0b1863ac2c6d84bd95", path = "native/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
