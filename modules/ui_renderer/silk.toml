[package]
name = "graphics-ui-renderer"
description = "Draws a finished UI scene with WebGPU, natively and in the browser"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["text", "atlas_textures", "instances", "renderer", "generated_shaders", "readback", "compare"]

[dependencies]
vector = { path = "../vector", package = "graphics-vector" }
atlas = { path = "../atlas", package = "graphics-atlas" }
ui_scene = { path = "../ui_scene", package = "graphics-ui-scene" }
gpu_scene = { path = "../gpu_scene", package = "graphics-gpu-scene" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "71bd41ea83e25289585571df55d2bc9944d4a43c", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "71bd41ea83e25289585571df55d2bc9944d4a43c", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
