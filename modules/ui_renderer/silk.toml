[package]
name = "graphics-ui-renderer"
description = "Draws a finished UI scene with WebGPU, natively and in the browser"
version = "0.1.0"
silk-version = "0.1.0-dev.69+366225ca4dc5"
kind = "library"
exports = ["text", "atlas_textures", "instances", "renderer", "generated_shaders", "readback", "compare"]

[dependencies]
vector = { path = "../vector", package = "graphics-vector" }
atlas = { path = "../atlas", package = "graphics-atlas" }
ui_scene = { path = "../ui_scene", package = "graphics-ui-scene" }
gpu_scene = { path = "../gpu_scene", package = "graphics-gpu-scene" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "66c80a2e4afdf43787d9ec63a474d793e3da1194", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "66c80a2e4afdf43787d9ec63a474d793e3da1194", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
