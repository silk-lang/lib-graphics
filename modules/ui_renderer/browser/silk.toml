[package]
name = "graphics-ui-renderer-browser"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "executable"

[dependencies]
vector = { path = "../../vector", package = "graphics-vector" }
atlas = { path = "../../atlas", package = "graphics-atlas" }
ui_scene = { path = "../../ui_scene", package = "graphics-ui-scene" }
ui_renderer = { path = "..", package = "graphics-ui-renderer" }
ui_fixtures = { path = "../fixtures", package = "graphics-ui-renderer-fixtures" }
gpu_scene = { path = "../../gpu_scene", package = "graphics-gpu-scene" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "2e4a8349e2afa7aace8e9bda7d876dce2daf9d69", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "2e4a8349e2afa7aace8e9bda7d876dce2daf9d69", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
