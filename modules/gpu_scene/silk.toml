[package]
name = "graphics-gpu-scene"
description = "Draws vector scenes on WebGPU, matching the CPU renderer's output"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["scene", "renderer", "filter", "generated_shaders"]

[dependencies]
vector = { path = "../vector", package = "graphics-vector" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "2647dff3423cd555b5e6389be4110d8adffcb577", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "2647dff3423cd555b5e6389be4110d8adffcb577", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
