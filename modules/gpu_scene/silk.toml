[package]
name = "graphics-gpu-scene"
description = "Draws vector scenes on WebGPU, matching the CPU renderer's output"
version = "0.1.0"
kind = "library"
exports = ["scene", "renderer", "filter", "generated_shaders"]

[dependencies]
vector = { path = "../vector", package = "graphics-vector" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "dad0eea58af5b801de16085a8666fadef2b746b0", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "dad0eea58af5b801de16085a8666fadef2b746b0", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
